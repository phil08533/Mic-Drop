<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee6d3" />
  <meta name="description" content="The rap battle party game. Draw a card, spit a verse, let the room decide." />
  <title>Mic Drop</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <canvas id="fire" class="fire" aria-hidden="true"></canvas>

  <div id="app" class="app" data-screen="loading">
    <header class="topbar">
      <button class="btn icon" id="back-btn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg>
      </button>
      <a class="brand" href="#" data-action="home" aria-label="Mic Drop, home">Mic Drop</a>
      <div class="topbar-spacer"></div>
      <button class="np" id="now-playing" data-action="open-music" title="Open the Beats player" hidden>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="np-title"></span>
        <span class="np-bpm"></span>
      </button>
      <button class="btn small nav-help" data-action="help" aria-label="How to play" title="How to play">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 015.4 1c0 1.9-2.7 2.4-2.7 4.1"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span>How to play</span>
      </button>
      <button class="btn small nav-lab" data-action="beat-lab" aria-label="Beat Lab" title="Beat Lab">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM16 10h4v4h-4zM10 16h4v4h-4z" fill="currentColor"/><path d="M10 10h4v4h-4zM4 16h4v4H4zM16 16h4v4h-4z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Beat Lab</span>
      </button>
      <button class="btn icon" data-action="open-viz" aria-label="Visualizer" title="Visualizer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12h3l2-6 3.5 13 3.5-11 2.2 6.5 1.3-2.5h3.5"/></svg>
      </button>
      <button class="btn icon" data-action="open-music" aria-label="Beats" title="Beats">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      </button>
      <button class="btn icon" data-action="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </header>

    <main id="screen" class="screen" aria-live="polite">
      <div class="loader">Setting up the booth&hellip;</div>
    </main>

    <aside class="drawer" id="music-drawer" aria-hidden="true" aria-label="Beats player"></aside>
    <aside class="drawer" id="settings-drawer" aria-hidden="true" aria-label="Settings"></aside>
    <div class="scrim" id="scrim" hidden></div>
  </div>

  <template id="tpl-home">
    <section class="home">
      <div class="poster">
        <p class="poster-top"><span>Tonight</span><span>Live from your living room</span><span>No cover</span></p>
        <h1 class="wordmark" aria-label="Mic Drop"><span>Mic</span><span>Drop</span></h1>
        <p class="poster-sub">The rap battle party game. Draw a card, spit a verse, let the room decide.</p>
        <button class="btn big poster-help" data-action="help">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 015.4 1c0 1.9-2.7 2.4-2.7 4.1"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></svg>
          New here? How to play
        </button>
      </div>
      <div class="bill">
        <button class="event red" data-action="start-crew">
          <span class="event-tag">Main event</span>
          <span class="event-title">Crew Battle</span>
          <span class="event-desc">Two or three crews trade bars one-on-one. The crew sitting out judges. Most points takes the belt.</span>
          <span class="event-meta">2–3 crews · any size</span>
          <span class="event-cta">Step in &rarr;</span>
        </button>
        <button class="event gold" data-action="start-koth">
          <span class="event-tag">Open cypher</span>
          <span class="event-title">King of the Hill</span>
          <span class="event-desc">Everybody in one line. Two step up and the room picks. Winner keeps the crown until somebody takes it.</span>
          <span class="event-meta">2+ rappers · jump in any time</span>
          <span class="event-cta">Take the hill &rarr;</span>
        </button>
        <button class="event blue" data-action="beat-lab">
          <span class="event-tag">Undercard</span>
          <span class="event-title">Beat Lab</span>
          <span class="event-desc">No beat? Make one. Sixteen steps, an 808 and chords that move for you. Save it, then battle on it.</span>
          <span class="event-meta">Drum machine · WAV export</span>
          <span class="event-cta">Build a beat &rarr;</span>
        </button>
      </div>
      <div class="home-foot">
        <div class="btnrow">
          <button class="btn ink" data-action="install" hidden>Install app</button>
          <button class="btn" data-action="how">Full rules</button>
          <button class="btn" data-action="open-music">Beats</button>
          <button class="btn" data-action="open-viz">Visualizer</button>
        </div>
        <p class="fine">No weapons but words. Roast the bars, not the person.</p>
      </div>
    </section>
  </template>

  <template id="tpl-how">
    <section class="how">
      <header class="screen-head">
        <p class="kicker">Official rules</p>
        <h2 class="screen-title">How a bout <em>works</em></h2>
      </header>
      <ol class="rules">
        <li><h3>Draw</h3><p>Both rappers flip their cards: <b>Burn</b> (roast the other rapper) or <b>Boast</b> (hype yourself), plus a <b>Rhyme</b> word to land. What you rap about is up to you. Sometimes a <b>Twist</b> adds a rule for both.</p></li>
        <li><h3>Ding ding</h3><p>The bell starts the clock and drops the beat. The first rapper gets one verse, then the mic goes across for the answer.</p></li>
        <li><h3>Decide</h3><p>The judges pick a winner, or use the <b>Crowd meter</b>: the room cheers for each rapper and the mic hears who got the bigger reaction.</p></li>
        <li><h3>Mic drop</h3><p>Somebody lands a bar so cold the room loses it? Hit <b>Mic drop</b> during their verse. Instant win, double points.</p></li>
      </ol>
      <div class="how-modes">
        <article class="panel">
          <h3 class="panel-title">Crew Battle</h3>
          <ul>
            <li>2 or 3 crews, any number of rappers each.</li>
            <li>Rappers go one-on-one down the lineup.</li>
            <li>With three crews, the one sitting out judges, then everybody rotates: every crew battles twice and judges once.</li>
            <li>A bout win is 1 point, a mic drop 2. Ties go to sudden death.</li>
          </ul>
        </article>
        <article class="panel">
          <h3 class="panel-title">King of the Hill</h3>
          <ul>
            <li>Everybody joins one line.</li>
            <li>The challenger raps first and the king answers.</li>
            <li>The winner keeps the crown, the loser goes to the back of the line.</li>
            <li>Three in a row and you're on fire. Longest streak takes the night.</li>
          </ul>
        </article>
        <article class="panel">
          <h3 class="panel-title">House rules</h3>
          <ul>
            <li>Roast the bars, not the person. Nothing that would really hurt.</li>
            <li>Cards are prompts, not orders. Bend them if it makes a better bar.</li>
            <li>The soundboard has an air horn. Use it wisely. Or don't.</li>
            <li>Space rings the bell and pauses the clock.</li>
          </ul>
        </article>
      </div>
      <div class="btnrow">
        <button class="btn ink big" data-action="start-crew">Start a Crew Battle</button>
        <button class="btn" data-action="start-koth">Start King of the Hill</button>
      </div>
    </section>
  </template>

  <script>
    // If something breaks, say so on screen (instead of buttons silently doing
    // nothing), and offer a one-tap repair that clears the offline cache.
    (function () {
      function banner(msg) {
        if (document.getElementById('crash')) return;
        var d = document.createElement('div');
        d.id = 'crash';
        d.className = 'crash';
        d.innerHTML = '<p><b>Something went wrong.</b> <span></span></p><button class="btn ink" type="button">Repair &amp; reload</button>';
        d.querySelector('span').textContent = msg || '';
        d.querySelector('button').onclick = repair;
        document.body.appendChild(d);
      }
      function repair() {
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      window.addEventListener('error', function (e) { if (e.message) banner(e.message); });
      window.addEventListener('unhandledrejection', function (e) { banner(String(e.reason && e.reason.message || e.reason || '')); });
      // Opened by double-clicking index.html: browsers block the app's scripts there.
      if (location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          banner('Mic Drop has to be opened from a web address, not by double-clicking index.html. Run "python3 -m http.server" in the folder and open http://localhost:8000, or use the hosted link.');
        });
      }
      // The app never started (old cached files, unsupported browser...).
      setTimeout(function () {
        if (document.getElementById('app').dataset.screen === 'loading') banner('The app didn’t start.');
      }, 8000);

      if ('serviceWorker' in navigator) {
        var hadController = !!navigator.serviceWorker.controller, reloaded = false;
        // A new version took over: reload once so the page runs the new code.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadController && !reloaded) { reloaded = true; location.reload(); }
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
            .then(function (r) { r.update(); }).catch(function () {});
        });
      }
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
